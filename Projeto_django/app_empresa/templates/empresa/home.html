{% load static %} 
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Cadastro de Empresas</title>
</head>
<body>
    <nav class="navbar navbar-light bg-light" style="background-color: #8CE5DB !important;">
        <div class="container-fluid">
            <section style="display: flex;flex-direction: row;text-align: center;align-items: center;">
                <a href="{% url 'home' %}"><p style="font-size:40px;transform: rotate(180deg);color:#AF0A01;">&rarr;<p></p></a>
                <a class="navbar-brand" style="color:#AF0A01;margin-left: 20%;" href="{% url 'home' %}">Cadastro de Parceiros</a>
            </section>
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-0">
                <div class="sidebar-header">
                    <h5>Empresa</h5>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="{% url 'home' %}">Cadastro de empresas</a>
                    <a class="nav-link" href="{% url 'listagem_empresas' %}">Editar dados empresa</a>
                </nav>
            </div>
            
            <!-- Main content -->
            <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">
                <h1 style="padding: 2%;text-align: center;background-color: #a2a2a2;">Formulário</h1>
                <form action="{% url 'listagem_empresas' %}" id="empresaForm" method="post" style="background-color: grey; padding: 2.5%; max-width: 650px; margin: 5rem auto; border-radius: 8px;">
                    {% csrf_token %}
                    <h2>Cadastro da Empresa</h2>
                    
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Empresa:</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="cnpj" class="form-label">CNPJ:</label>
                        <input type="text" class="form-control" id="cnpj" name="cnpj" 
                               pattern="\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}" 
                               placeholder="00.000.000/0000-00" required>
                        <div id="cnpjFeedback" class="invalid-feedback"></div>
                        <small class="form-text text-muted">Formato: 00.000.000/0000-00</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone de Contato:</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" 
                               pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" 
                               placeholder="(00) 00000-0000" required>
                    </div>
                    
                    <h3 class="mt-4">Endereço</h3>
                    
                    <div class="mb-3">
                        <label for="cep" class="form-label">CEP:</label>
                        <input type="text" class="form-control" id="cep" name="cep" 
                               pattern="\d{5}-\d{3}" 
                               placeholder="00000-000" required>
                        <div id="cepFeedback" class="invalid-feedback"></div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label for="endereco" class="form-label">Endereço:</label>
                            <input type="text" class="form-control" id="endereco" name="endereco" required>
                        </div>
                        <div class="col-md-4">
                            <label for="numero" class="form-label">Nº:</label>
                            <input type="text" class="form-control" id="numero" name="numero" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="bairro" class="form-label">Bairro:</label>
                        <input type="text" class="form-control" id="bairro" name="bairro">
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="estado" class="form-label">Estado:</label>
                            <select class="form-select" id="estado" name="estado" required>
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="cidade" class="form-label">Cidade:</label>
                            <select class="form-select" id="cidade" name="cidade" required disabled>
                                <option value="">Selecione o estado primeiro</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 mt-3">Salvar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
